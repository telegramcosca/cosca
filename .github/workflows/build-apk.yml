name: Build Casca APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # Capacitor 5 ke liye Java 17 sabse best hai
          java-version: '17'

      - name: Build Standalone APK
        run: |
          mkdir casca-mobile-app
          cd casca-mobile-app
          
          npm init -y
          # Naye unstable version (v6) ki jagah hum stable v5 install karenge
          npm install @capacitor/core@5 @capacitor/android@5
          npm install @capacitor/cli@5 --save-dev
          
          echo '{
            "appId": "com.casca.app",
            "appName": "Casca",
            "webDir": "www",
            "server": {
              "url": "https://cosca-production-ec29.up.railway.app/",
              "cleartext": true
            }
          }' > capacitor.config.json
          
          mkdir www
          echo "<html><body>Loading Casca...</body></html>" > www/index.html
          
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Casca-App-APK
          path: casca-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
