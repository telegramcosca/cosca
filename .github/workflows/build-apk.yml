name: Build Casca APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Standalone APK
        run: |
          # 1. Naya folder banayen taaki aapke code se conflict na ho
          mkdir casca-mobile-app
          cd casca-mobile-app
          
          # 2. NPM aur Capacitor setup karein
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install @capacitor/cli --save-dev
          
          # 3. App ki config file set karein (Direct Railway URL ke sath)
          echo '{
            "appId": "com.casca.app",
            "appName": "Casca",
            "webDir": "www",
            "server": {
              "url": "https://cosca-production-ec29.up.railway.app/",
              "cleartext": true
            }
          }' > capacitor.config.json
          
          # 4. Dummy web folder banayen
          mkdir www
          echo "<html><body>Loading Casca...</body></html>" > www/index.html
          
          # 5. Android project banayen aur APK build karein
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Casca-App-APK
          path: casca-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
