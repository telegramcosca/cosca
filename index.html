<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        /* Header color change for status */
        #header { background: #2b2b2b; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; transition: 0.3s; }
        #chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message { background: white; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 15px; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #msg-input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; font-size: 16px; }
        #send-btn { background: #2b2b2b; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">Casca (Connecting... ⏳)</div>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Message type karein...">
        <button id="send-btn">Send</button>
    </div>

    <!-- Socket.io connection -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        // Server se connection banayein
        const socket = io('[https://cosca-production-ec29.up.railway.app](https://cosca-production-ec29.up.railway.app)');

        const header = document.getElementById('header');
        const sendBtn = document.getElementById('send-btn');
        const msgInput = document.getElementById('msg-input');
        const chatBox = document.getElementById('chat-box');

        // Agar successfully connect ho jaye
        socket.on('connect', () => {
            header.innerText = "Casca (Online 🟢)";
            header.style.background = "#128C7E"; // WhatsApp jaisa green color
        });

        // Agar connection toot jaye
        socket.on('disconnect', () => {
            header.innerText = "Casca (Offline 🔴)";
            header.style.background = "#D32F2F"; // Red color
        });

        // Send button ka logic
        sendBtn.addEventListener('click', () => {
            const msg = msgInput.value;
            if(msg.trim() !== "") {
                socket.emit('send_message', msg); // Server ko bhejo
                msgInput.value = ''; // Type karne wala box khali kar do
            }
        });

        // Naya message aane par UI mein dikhana
        socket.on('receive_message', (msg) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerText = msg;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
