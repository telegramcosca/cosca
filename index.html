<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casca</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        
        /* 1. Exact Original Deep Background */
        #welcome-screen { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: linear-gradient(150deg, #0e1671 0%, #291299 45%, #5611c0 100%); 
            color: white; text-align: center; position: relative; overflow: hidden; 
        }

        /* 2. Exact Original Sparkles (Top Right) */
        .sparkles { position: absolute; top: 6%; right: 8%; width: 55px; opacity: 1; z-index: 3; }
        
        /* 3. Original Sharp Glass Waves */
        .bg-waves { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 4. 3D Logo Container */
        .logo-container { 
            z-index: 3; margin-bottom: 5px; width: 140px; height: 140px; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        /* 5. Perfect Typography */
        .welcome-title { font-size: 64px; font-weight: 800; margin: 0; z-index: 3; letter-spacing: 0.5px; }
        .welcome-subtitle { font-size: 17px; margin: 15px 0 45px; color: #f0f0f5; line-height: 1.5; font-weight: 400; z-index: 3; }
        
        /* 6. Exact Dots */
        .dots { display: flex; gap: 10px; margin-bottom: 55px; z-index: 3; }
        .dot { width: 9px; height: 9px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        .dot.active { background: #00d2ff; }
        
        /* 7. Exact Button Gradient */
        #start-btn { 
            background: linear-gradient(90deg, #00c6ff 0%, #0066ff 100%); 
            color: white; border: none; padding: 18px 0; border-radius: 30px; 
            font-size: 20px; font-weight: 600; cursor: pointer; width: 85%; max-width: 320px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.25); transition: 0.2s; z-index: 3;
            font-family: 'Poppins', sans-serif;
        }
        #start-btn:active { transform: scale(0.96); }

        /* Login & Chat Screens (Hidden initially) */
        #login-screen { display: none; flex: 1; flex-direction: column; justify-content: center; align-items: center; background: #f0f2f5; }
        .google-btn { background: #4285F4; color: white; text-decoration: none; padding: 12px 24px; border-radius: 20px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        
        #chat-container { display: none; flex: 1; flex-direction: column; overflow: hidden; background: #e5ddd5; }
        #header { background: #128C7E; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        #logout-btn { background: #d32f2f; color: white; text-decoration: none; padding: 5px 12px; border-radius: 15px; font-size: 14px; }
        #chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message { background: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 15px; position: relative; font-family: Arial, sans-serif; }
        .my-message { background: #dcf8c6; align-self: flex-end; }
        .sender-name { font-size: 11px; font-weight: bold; color: #075E54; margin-bottom: 4px; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #msg-input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; font-size: 16px; font-family: Arial, sans-serif; }
        #send-btn { background: #128C7E; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        
        <!-- Sharp Glass Waves exactly like the original design -->
        <svg class="bg-waves" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0,0 L100,0 C70,30 40,50 0,60 Z" fill="rgba(0, 162, 255, 0.08)"/>
            <path d="M0,0 L60,0 C40,20 20,30 0,40 Z" fill="rgba(0, 162, 255, 0.12)"/>
            <path d="M100,100 L0,100 C30,70 60,50 100,40 Z" fill="rgba(144, 46, 242, 0.08)"/>
            <path d="M100,100 L40,100 C60,80 80,70 100,60 Z" fill="rgba(144, 46, 242, 0.12)"/>
        </svg>

        <!-- Sparkles SVG -->
        <svg class="sparkles" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 0 L13 13 L26 16 L13 19 L10 32 L7 19 L-6 16 L7 13 Z" fill="#ffffff" opacity="0.8"/>
            <path d="M35 15 L37 23 L45 25 L37 27 L35 35 L33 27 L25 25 L33 23 Z" fill="#ffffff" opacity="0.9"/>
        </svg>

        <!-- 100% Exact 3D Kite Logo (No background box) -->
        <div class="logo-container">
            <svg viewBox="0 0 120 130" style="width: 140px; height: auto;" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 4 Facets of the Kite for the 3D Light/Shadow effect -->
                <path d="M 50 10 L 20 50 L 58 48 Z" fill="#ffffff"/>
                <path d="M 50 10 L 100 40 L 58 48 Z" fill="#f1f5f9"/>
                <path d="M 20 50 L 65 95 L 58 48 Z" fill="#cbd5e1"/>
                <path d="M 100 40 L 65 95 L 58 48 Z" fill="#ffffff"/>
                <!-- Sweeping Curved Ribbons -->
                <path d="M 80 65 C 90 75, 105 80, 115 100 C 100 90, 85 90, 70 75 Z" fill="#ffffff"/>
                <path d="M 65 95 C 75 105, 95 110, 105 130 C 90 120, 75 120, 55 105 Z" fill="#ffffff"/>
            </svg>
        </div>
        
        <h1 class="welcome-title">Casca</h1>
        <p class="welcome-subtitle">The world's fastest messaging app.<br>It is free and secure.</p>
        
        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        
        <button id="start-btn">Start Messaging</button>
    </div>

    <!-- Login & Chat HTML exactly as before -->
    <div id="login-screen">
        <h1 style="color: #128C7E; margin-bottom: 10px;">Login</h1>
        <p style="color: #666; margin-bottom: 30px;">Choose a login method</p>
        <a href="/auth/google" class="google-btn">G Continue with Google</a>
    </div>

    <div id="chat-container">
        <div id="header">
            <span id="status-text">Casca</span>
            <a href="/logout" id="logout-btn">Logout</a>
        </div>
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let currentUser = null;

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        });

        fetch('/api/current_user')
            .then(res => res.text())
            .then(text => {
                if (text) {
                    try {
                        currentUser = JSON.parse(text);
                        document.getElementById('welcome-screen').style.display = 'none';
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('chat-container').style.display = 'flex';
                        startChatSystem();
                    } catch(e) {}
                }
            });

        function startChatSystem() {
            const socket = io();
            const headerText = document.getElementById('status-text');
            const sendBtn = document.getElementById('send-btn');
            const msgInput = document.getElementById('msg-input');
            const chatBox = document.getElementById('chat-box');

            socket.on('connect', () => {
                headerText.innerText = `Casca (${currentUser.displayName.split(" ")[0]} 🟢)`;
            });

            socket.on('disconnect', () => {
                headerText.innerText = "Casca (Offline 🔴)";
            });

            sendBtn.addEventListener('click', () => {
                const msgText = msgInput.value.trim();
                if(msgText !== "") {
                    socket.emit('send_message', { text: msgText, senderName: currentUser.displayName });
                    msgInput.value = '';
                }
            });

            socket.on('receive_message', (data) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message';
                if (data.senderName === currentUser.displayName) msgDiv.classList.add('my-message');
                
                const nameSpan = document.createElement('div');
                nameSpan.className = 'sender-name';
                nameSpan.innerText = data.senderName;
                
                const textSpan = document.createElement('div');
                textSpan.innerText = data.text;

                msgDiv.appendChild(nameSpan);
                msgDiv.appendChild(textSpan);
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
