<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casca</title>
    <!-- Font add kiya hai taaki text ekdum original jaisa lage -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        
        /* 1. Exactly Matching Welcome Screen */
        #welcome-screen { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: linear-gradient(160deg, #1833a6 0%, #4622b8 50%, #6f26d9 100%); 
            color: white; text-align: center; position: relative; overflow: hidden; 
        }

        /* Background Waves & Glows */
        #welcome-screen::before {
            content: ''; position: absolute; top: -15%; left: -20%; width: 70%; height: 40%;
            background: radial-gradient(circle, rgba(41,98,255,0.4) 0%, transparent 70%); border-radius: 50%;
        }
        #welcome-screen::after {
            content: ''; position: absolute; bottom: -10%; right: -20%; width: 80%; height: 50%;
            background: radial-gradient(circle, rgba(121,46,242,0.4) 0%, transparent 70%); border-radius: 50%;
        }

        /* Sparkles (Top Right) */
        .sparkles { position: absolute; top: 10%; right: 10%; width: 40px; opacity: 0.8; }

        /* Custom Logo Area */
        .logo-container { z-index: 2; margin-bottom: 10px; width: 130px; height: 130px; display: flex; justify-content: center; align-items: center; }
        .logo-container img { max-width: 100%; height: auto; } /* Agar aap apni asli image lagana chahein */
        
        .welcome-title { font-size: 52px; font-weight: 700; margin: 0; z-index: 2; letter-spacing: 0.5px; }
        .welcome-subtitle { font-size: 16px; margin: 10px 0 30px; color: #d6d3f0; line-height: 1.4; font-weight: 400; z-index: 2; }
        
        .dots { display: flex; gap: 8px; margin-bottom: 50px; z-index: 2; }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        .dot.active { background: #00d2ff; }
        
        #start-btn { 
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%); 
            color: white; border: none; padding: 18px 40px; border-radius: 30px; 
            font-size: 18px; font-weight: 600; cursor: pointer; width: 85%; max-width: 320px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); transition: 0.2s; z-index: 2;
            font-family: 'Poppins', sans-serif;
        }
        #start-btn:active { transform: scale(0.96); }

        /* 2. Login Screen Styles */
        #login-screen { display: none; flex: 1; flex-direction: column; justify-content: center; align-items: center; background: #f0f2f5; }
        .google-btn { background: #4285F4; color: white; text-decoration: none; padding: 12px 24px; border-radius: 20px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        
        /* 3. Chat Screen Styles */
        #chat-container { display: none; flex: 1; flex-direction: column; overflow: hidden; background: #e5ddd5; }
        #header { background: #128C7E; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        #logout-btn { background: #d32f2f; color: white; text-decoration: none; padding: 5px 12px; border-radius: 15px; font-size: 14px; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message { background: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 15px; position: relative; font-family: Arial, sans-serif; }
        .my-message { background: #dcf8c6; align-self: flex-end; }
        .sender-name { font-size: 11px; font-weight: bold; color: #075E54; margin-bottom: 4px; }
        
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #msg-input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; font-size: 16px; font-family: Arial, sans-serif; }
        #send-btn { background: #128C7E; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        
        <!-- Top Right Sparkles SVG -->
        <svg class="sparkles" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 0 L13 13 L26 16 L13 19 L10 32 L7 19 L-6 16 L7 13 Z" fill="#ffffff" opacity="0.6"/>
            <path d="M35 15 L37 23 L45 25 L37 27 L35 35 L33 27 L25 25 L33 23 Z" fill="#ffffff" opacity="0.8"/>
        </svg>

        <!-- Logo Container -->
        <div class="logo-container">
            <img src="https://i.postimg.cc/MK726vxY/IMG-20260920-190927.jpg" alt="Casca Logo" style="width: 120px; height: auto;">
            
        </div>
        
        
        <h1 class="welcome-title">Casca</h1>
        <p class="welcome-subtitle">The world's fastest messaging app.<br>It is free and secure.</p>
        
        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        
        <button id="start-btn">Start Messaging</button>
    </div>

    <!-- 2. LOGIN SCREEN -->
    <div id="login-screen">
        <h1 style="color: #128C7E; margin-bottom: 10px;">Login</h1>
        <p style="color: #666; margin-bottom: 30px;">Choose a login method</p>
        <a href="/auth/google" class="google-btn">G Continue with Google</a>
    </div>

    <!-- 3. CHAT SCREEN -->
    <div id="chat-container">
        <div id="header">
            <span id="status-text">Casca</span>
            <a href="/logout" id="logout-btn">Logout</a>
        </div>
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let currentUser = null;

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        });

        fetch('/api/current_user')
            .then(res => res.text())
            .then(text => {
                if (text) {
                    try {
                        currentUser = JSON.parse(text);
                        document.getElementById('welcome-screen').style.display = 'none';
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('chat-container').style.display = 'flex';
                        startChatSystem();
                    } catch(e) {}
                }
            });

        function startChatSystem() {
            const socket = io();
            const headerText = document.getElementById('status-text');
            const sendBtn = document.getElementById('send-btn');
            const msgInput = document.getElementById('msg-input');
            const chatBox = document.getElementById('chat-box');

            socket.on('connect', () => {
                headerText.innerText = `Casca (${currentUser.displayName.split(" ")[0]} 🟢)`;
            });

            socket.on('disconnect', () => {
                headerText.innerText = "Casca (Offline 🔴)";
            });

            sendBtn.addEventListener('click', () => {
                const msgText = msgInput.value.trim();
                if(msgText !== "") {
                    socket.emit('send_message', { text: msgText, senderName: currentUser.displayName });
                    msgInput.value = '';
                }
            });

            socket.on('receive_message', (data) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message';
                if (data.senderName === currentUser.displayName) msgDiv.classList.add('my-message');
                
                const nameSpan = document.createElement('div');
                nameSpan.className = 'sender-name';
                nameSpan.innerText = data.senderName;
                
                const textSpan = document.createElement('div');
                textSpan.innerText = data.text;

                msgDiv.appendChild(nameSpan);
                msgDiv.appendChild(textSpan);
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
