<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f27b4">
<title>Casca – Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --bg-left: #1129b1;
    --bg-mid: #2b25ab;
    --bg-right: #421fce;
    --bg-glow: #7a3cfd;
    --cta-from: #00a4ff;
    --cta-to: #7f45fd;
    --dot-active: #01a3fb;
    --dot-idle: rgba(200, 185, 255, .5);
    --sparkle: rgba(196, 181, 255, .64);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0c26; -webkit-text-size-adjust: 100%; }
  body { display: flex; justify-content: center; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .screen {
    --u: calc(min(100vw, 50vh) / 887);
    position: relative; width: min(100vw, 50vh); height: 100vh; overflow: hidden; isolation: isolate; color: var(--white);
  }
  @supports (height: 100dvh) { .screen { --u: calc(min(100vw, 50dvh) / 887); width: min(100vw, 50dvh); height: 100dvh; } }
  .bg {
    position: absolute; inset: 0; z-index: -3;
    background: radial-gradient(circle at 100% 0, var(--bg-glow) 0, rgba(122,60,253,.45) calc(150*var(--u)), rgba(100,45,245,.18) calc(380*var(--u)), rgba(100,45,245,0) calc(600*var(--u))),
                linear-gradient(to right, var(--bg-left) 0%, #1c28ab 17%, #2326a8 34%, var(--bg-mid) 50%, #3223b6 68%, #3d20c6 85%, var(--bg-right) 100%);
  }
  .deco { position: absolute; display: block; pointer-events: none; overflow: visible; z-index: -2; }
  .deco--top-left { top: 0; left: 0; width: calc(400 * var(--u)); }
  .deco--bottom { bottom: 0; left: 0; width: 100%; }
  .deco--sparkles { top: calc(80 * var(--u)); right: 0; width: calc(187 * var(--u)); z-index: -1; }
  .hero { position: absolute; top: 17.76%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo { display: block; width: calc(333 * var(--u)); height: auto; }
  .brand { margin-top: calc(5 * var(--u)); font-family: "Outfit", sans-serif; font-weight: 600; font-size: calc(127 * var(--u)); line-height: 1; color: var(--white); }
  .tagline { margin-top: calc(33 * var(--u)); font-family: "Outfit", sans-serif; font-weight: 400; font-size: calc(34 * var(--u)); line-height: calc(50 * var(--u)); color: rgba(255,255,255,.96); }
  .dots { margin-top: calc(61 * var(--u)); display: flex; gap: calc(16 * var(--u)); list-style: none; }
  .dots li { width: calc(17 * var(--u)); height: calc(17 * var(--u)); border-radius: 50%; background: var(--dot-idle); }
  .dots li[aria-current="true"] { background: var(--dot-active); }
  .cta {
    position: absolute; left: calc(64 * var(--u)); right: calc(64 * var(--u)); bottom: calc(173 * var(--u)); height: calc(132 * var(--u));
    display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px;
    background: linear-gradient(to right, var(--cta-from) 0%, #3a74fd 50%, var(--cta-to) 100%);
    box-shadow: 0 calc(10 * var(--u)) calc(34 * var(--u)) rgba(30,90,255,.18);
    font-family: "Inter", sans-serif; font-weight: 500; font-size: calc(35 * var(--u)); color: var(--white); cursor: pointer;
  }
</style>
</head>
<body>
<main class="screen">
  <div class="bg" aria-hidden="true"></div>
  <section class="hero">
    <svg class="logo" viewBox="277 315 333 438" role="img" aria-label="Casca kite logo">
      <path fill="#fff" fill-rule="evenodd" d="M425,609 L427.6,603.9 C437.4,692.1 541.3,674.1 570.9,749.1 C571.3,740.8 570.5,731.9 567.6,723.9 C550.8,651.2 455.2,672.5 433.6,601.6 C434.4,598.1 437.9,594.3 440.1,591.6 C444.1,596.9 446.7,603.3 451.9,608.4 C490.1,656.2 556.8,618.5 593.6,671.4 L589.9,650.6 L604.4,643.6 C599.3,639.4 594.3,635 588.9,631.6 C545.2,597.3 480.6,639.3 443.1,587.1 L546,450 L425,318 L303,451 Z M426,332 L497,416 L426,431 Z M496,419 L497,421 L426,598 L425,443 L336,472 L309,452 L426,431 L426,441 Z"/>
    </svg>
    <h1 class="brand">Casca</h1>
    <p class="tagline">The world’s fastest messaging app.<br>It is free and secure.</p>
    <ol class="dots" aria-label="Onboarding progress">
      <li aria-current="true"></li><li></li><li></li><li></li><li></li><li></li>
    </ol>
  </section>
  <button class="cta" type="button" id="startBtn">Start Messaging</button>
</main>
<script>
  document.getElementById('startBtn').addEventListener('click', function () {
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
