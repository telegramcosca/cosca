<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b37e0">
<title>Login - Casca</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-top:        #1f3fd8;
    --bg-mid:        #2b37e0;
    --bg-bottom:     #4726ee;
    --white:         #ffffff;
    --subtitle:      #a7aef6;
    --or-text:       #8087f0;
    --line:          #4a57e8;
    --arrow-light:   #8b8ff6;
    --arrow-google:  #6a62ee;
    --google-bg:     #eef0fd;
    --google-text:   #1b2678;
    --dark-btn-bg:   rgba(24, 20, 130, .55);
    --dark-btn-ring: #4654e9;
    --footer-text:   #9ca3f2;
    --link:          #22e6f2;
    --font: "Figtree", "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #1a1f9a;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .stage {
    --u: calc(100cqw / 928);
    position: relative;
    width: min(100vw, calc(100dvh * 928 / 1695));
    aspect-ratio: 928 / 1695;
    container-type: inline-size;
    overflow: hidden;
    color: var(--white);
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(96, 60, 240, .35) 0%, rgba(96, 60, 240, 0) 60%),
      linear-gradient(172deg, var(--bg-top) 0%, var(--bg-mid) 38%, var(--bg-bottom) 100%);
  }

  @media (min-width: 600px) {
    .stage { border-radius: 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
  }

  .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .abs { position: absolute; }

  .back {
    position: absolute;
    left:  calc(var(--u) * 26);
    top:   calc(var(--u) * 30);
    width: calc(var(--u) * 80);
    height: calc(var(--u) * 76);
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    border-radius: 50%;
    color: var(--white);
    cursor: pointer;
  }
  .back svg { width: calc(var(--u) * 49); height: calc(var(--u) * 46); display: block; }

  .title {
    position: absolute;
    left: 0;
    width: 100%;
    top: calc(var(--u) * 571);
    text-align: center;
    font-weight: 700;
    font-size: calc(var(--u) * 74);
    line-height: calc(var(--u) * 80);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .subtitle {
    position: absolute;
    left: calc(var(--u) * 100);
    width: calc(var(--u) * 732);
    top: calc(var(--u) * 669);
    text-align: center;
    font-weight: 400;
    font-size: calc(var(--u) * 34);
    line-height: calc(var(--u) * 47.5);
    color: var(--subtitle);
  }

  .btn {
    position: absolute;
    left:  calc(var(--u) * 91);
    width: calc(var(--u) * 749);
    height: calc(var(--u) * 122);
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 600;
    font-size: calc(var(--u) * 36);
    text-align: left;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  .btn .icon, .btn .label, .btn .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: block;
  }
  .btn .label { white-space: nowrap; line-height: 1; }
  .btn .arrow {
    left: calc(var(--u) * 658);
    width: calc(var(--u) * 47);
    height: calc(var(--u) * 34);
  }

  .btn--google {
    top: calc(var(--u) * 820);
    background: var(--google-bg);
    color: var(--google-text);
    font-weight: 700;
    box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 28) rgba(10, 10, 90, .28);
  }
  .btn--google .icon  { left: calc(var(--u) * 39);  width: calc(var(--u) * 92); height: calc(var(--u) * 92); }
  .btn--google .label { left: calc(var(--u) * 185); }
  .btn--google .arrow { color: var(--arrow-google); }

  .btn--dark {
    background: var(--dark-btn-bg);
    color: var(--white);
    box-shadow: inset 0 0 0 calc(var(--u) * 2.5) var(--dark-btn-ring);
  }
  .btn--dark .label { left: calc(var(--u) * 190); }
  .btn--dark .arrow { color: var(--arrow-light); }

  .btn--github { top: calc(var(--u) * 980); }
  .btn--github .icon { left: calc(var(--u) * 46); width: calc(var(--u) * 82); height: calc(var(--u) * 82); }

  .btn--email  { top: calc(var(--u) * 1213); }
  .btn--email .icon  { left: calc(var(--u) * 55); width: calc(var(--u) * 65); height: calc(var(--u) * 55); }

  .or {
    position: absolute;
    left: calc(var(--u) * 142);
    width: calc(var(--u) * 644);
    top: calc(var(--u) * 1141);
    height: calc(var(--u) * 32);
    display: grid;
    grid-template-columns: calc(var(--u) * 260) 1fr calc(var(--u) * 258);
    align-items: center;
    text-align: center;
    font-weight: 700;
    font-size: calc(var(--u) * 27);
    line-height: 1;
    color: var(--or-text);
  }
  .or::before, .or::after {
    content: "";
    height: calc(var(--u) * 2.5);
    background: var(--line);
    border-radius: 2px;
  }

  .have-account {
    position: absolute;
    left: 0;
    width: 100%;
    top: calc(var(--u) * 1398);
    text-align: center;
    font-weight: 400;
    font-size: calc(var(--u) * 30);
    line-height: calc(var(--u) * 44);
    color: var(--subtitle);
  }
  .have-account a { color: inherit; text-decoration: none; }
  .have-account b { font-weight: 800; color: var(--white); }
  .have-account a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 4px; }

  .legal {
    position: absolute;
    left: 0;
    width: 100%;
    top: calc(var(--u) * 1530);
    text-align: center;
    font-weight: 400;
    font-size: calc(var(--u) * 23);
    line-height: calc(var(--u) * 35);
    color: var(--footer-text);
  }
  .legal a { color: var(--link); font-weight: 600; text-decoration: none; }
  .legal a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <main class="stage">
    <svg class="art" viewBox="0 0 928 1695" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="swooshTL" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1d6cff"/>
          <stop offset="1" stop-color="#1a58f0"/>
        </linearGradient>
        <linearGradient id="swooshBR" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9a62ff" stop-opacity=".95"/>
          <stop offset="1" stop-color="#6c3cf5" stop-opacity=".9"/>
        </linearGradient>
        <path id="sparkle" d="M0,-25 C3,-9 9,-3 25,0 C9,3 3,9 0,25 C-3,9 -9,3 -25,0 C-9,-3 -3,-9 0,-25 Z"/>
      </defs>
      <path d="M258,0 L356,0 C318,62 240,118 150,152 C86,176 40,204 0,262 L0,206 C36,178 76,158 122,138 C190,108 236,52 258,0 Z" fill="url(#swooshTL)"/>
      <path d="M0,0 L258,0 C236,52 190,108 122,138 C76,158 36,178 0,206 Z" fill="#1a3fdc" opacity=".55"/>
      <path d="M928,1365 C862,1440 770,1500 706,1608 C690,1636 676,1664 656,1695 L928,1695 Z" fill="#5a30f2" opacity=".55"/>
      <path d="M928,1365 C864,1442 772,1504 712,1606 C694,1638 682,1666 664,1695 L742,1695 C778,1624 848,1522 928,1490 Z" fill="url(#swooshBR)"/>
      <use href="#sparkle" transform="translate(829 112) scale(1.12)" fill="#8f8ff7"/>
      <use href="#sparkle" transform="translate(771 168) scale(0.96)" fill="#7f7cf2"/>
      <g transform="translate(374.4 253.4) scale(0.315) translate(-55 -42)">
        <path fill="#fff" fill-rule="evenodd" d="M322 47 L592 335 L325 665 L60 338 Z M327 84 L484 262 L327 293 Z M82 340 L322 293 L322 316 L122 376 Z M327 316 L481 271 L326 650 Z"/>
        <path fill="#fff" d="M352 624 C380 672 430 692 520 690 C600 688 660 700 732 752 L692 762 L705 806 C660 755 620 728 560 724 C470 718 400 704 344 646 Z"/>
        <path fill="#fff" d="M328 640 L328 662 C332 720 370 770 440 800 C510 830 560 850 600 915 C620 945 634 962 642 972 C640 900 610 840 540 806 C470 775 410 745 372 700 C354 682 344 662 338 640 Z"/>
      </g>
    </svg>

    <button class="back" type="button" aria-label="Go back" data-action="back">
      <svg viewBox="0 0 49 46" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M46.5 23H3M22 3.5L2.5 23 22 42.5"/>
      </svg>
    </button>

    <h1 class="title">Welcome to Casca</h1>
    <p class="subtitle">Choose how you want to log in to your Casca account.</p>

    <!-- ===== GOOGLE ===== -->
    <button class="btn btn--google" type="button" data-provider="google">
      <span class="icon">
        <svg viewBox="0 0 48 48" width="100%" height="100%" aria-hidden="true">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
      </span>
      <span class="label">Continue with Google</span>
      <svg class="arrow" viewBox="0 0 47 34" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 17H45M30 2.5L45 17 30 31.5"/>
      </svg>
    </button>

    <!-- ===== GITHUB ===== -->
    <button class="btn btn--dark btn--github" type="button" data-provider="github">
      <span class="icon">
        <svg viewBox="0 0 16 16" width="100%" height="100%" fill="#fff" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </span>
      <span class="label">Continue with GitHub</span>
      <svg class="arrow" viewBox="0 0 47 34" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 17H45M30 2.5L45 17 30 31.5"/>
      </svg>
    </button>

    <!-- ===== OR ===== -->
    <div class="or" role="separator" aria-label="or">OR</div>

    <!-- ===== EMAIL ===== -->
    <button class="btn btn--dark btn--email" type="button" data-provider="email">
      <span class="icon">
        <svg viewBox="0 0 65 55" width="100%" height="100%" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="59" height="49" rx="7"/>
          <path d="M5 11l27.5 21L60 11"/>
        </svg>
      </span>
      <span class="label">Continue with Email</span>
      <svg class="arrow" viewBox="0 0 47 34" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 17H45M30 2.5L45 17 30 31.5"/>
      </svg>
    </button>

    <!-- ===== ALREADY HAVE ACCOUNT ===== -->
    <p class="have-account"><a href="sign-in.html">Already have an <b>Account</b>.</a></p>

    <!-- ===== LEGAL ===== -->
    <p class="legal">
      By continuing, you agree to the<br>
      <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.
    </p>

  </main>

  <!-- ===== NAVIGATION SCRIPT ===== -->
  <script>
    document.querySelectorAll('[data-provider]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var provider = btn.dataset.provider; 
        
        if (provider === 'google') {
          window.location.href = '/auth/google';
        } else if (provider === 'github') {
          window.location.href = '/auth/github';
        } else if (provider === 'email') {
          window.location.href = 'verify-email.html'; // Step 3 (OTP) par jane ke liye
        }
      });
    });

    // Back button dabane par peeche jane ke liye
    document.querySelector('[data-action="back"]').addEventListener('click', function () {
      history.back();
    });
  </script>
</body>
</html>
